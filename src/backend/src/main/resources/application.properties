spring.application.name=insurewell
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:insurewell
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.insurewell=DEBUG

# Stripe test-mode credentials are supplied through the environment.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.frontend-base-url=${INSUREWELL_FRONTEND_URL:http://localhost:3000}
insurewell.payment.staff-principals=${INSUREWELL_PAYMENT_STAFF_PRINCIPALS:}
