spring.application.name=insurewell
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:insurewell
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.insurewell=DEBUG


# Microsoft Entra ID (Azure AD) Authentication
# mode: auto (enabled once tenant-id and client-id are set) | on | off
insurewell.security.mode=${INSUREWELL_SECURITY_MODE:auto}
insurewell.security.tenant-id=${AZURE_TENANT_ID:}
insurewell.security.client-id=${AZURE_CLIENT_ID:}
insurewell.security.instance=${AZURE_CLOUD_INSTANCE:https://login.microsoftonline.com}
insurewell.security.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Token-based auth only - no form login / default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
